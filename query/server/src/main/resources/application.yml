# The standalone query server. See combined/src/main/resources/application.yml for the port map.
# combined 9090, command/server 9091, query/server 9092, process/server 9093.
server:
  port: 9092

spring:
  application:
    name: jtenman-query
  security:
    oauth2:
      resourceserver:
        jwt:
          # The ONE realm jtenman accepts. Unlike a tenant application, jtenman is not multi-tenant:
          # SingleRealmTenantRepository pins the trust boundary to exactly this issuer. Without it the
          # auto-configured KeycloakTenantRepository would discover and accept every realm of the
          # instance - the very hole jtenman exists to close.
          issuer-uri: ${JTENMAN_ISSUER_URI:http://localhost:8180/realms/master}
          # Mandatory: the keycloak starter refuses to start without it.
          audiences: jtenman-api

org:
  fuin:
    cqrs4j:
      # jtenman IS the control plane and has no tenants of its own.
      multitenancy: false

jtenman:
  # Which applications exist in the system. Static on purpose - it changes rarely and a restart of
  # jtenman (and of nothing else) is acceptable. A tenant is then subscribed to one or more of these,
  # which IS domain state and needs no restart anywhere.
  applications:
    - id: melkheftken
      display-name: Melkheftken
      client-id: melkheftken-api
      audience: melkheftken-api

eventstore:
  url: ${KURRENTDB_URL:kurrentdb://localhost:2113?tls=false}

management:
  endpoints:
    web:
      exposure:
        # Everything beyond health/info stays closed - see steering/security.md.
        include: health,info
